<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>차시현 · Tristan Cha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#ffffff;
    --ink:#0a0a0a;
    --ink-70:rgba(10,10,10,.70);
    --ink-45:rgba(10,10,10,.45);
    --rule:rgba(10,10,10,.16);
    --rule-soft:rgba(10,10,10,.07);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;min-height:100dvh}
  body{
    background:var(--paper);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  /* 종이 질감 */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  }

  .card{
    position:relative;z-index:1;
    width:min(94vw,420px);
    padding:40px 36px 30px;
    background:var(--paper);
    border:1px solid var(--rule);
    overflow:hidden;
    animation:rise .9s cubic-bezier(.22,1,.36,1) both;
  }
  /* 이중 괘선(각인 느낌) */
  .card::before{
    content:'';position:absolute;inset:7px;border:1px solid var(--rule-soft);pointer-events:none;
  }

  /* 배경 워터마크 로고 */
  .watermark{
    position:absolute;right:-64px;bottom:-40px;
    width:300px;opacity:.055;pointer-events:none;user-select:none;
  }

  /* 상단 인장 */
  .seal{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
  .seal img{width:38px;display:block}
  .imprint{
    font-family:'JetBrains Mono',monospace;font-weight:300;
    font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-45);text-align:right;line-height:1.7;
  }

  .rule{height:1px;background:var(--rule);margin:22px 0 20px}
  .rule.thin{background:var(--rule-soft);margin:22px 0 16px}

  .name-ko{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:clamp(2.3rem,11vw,2.9rem);letter-spacing:.14em;line-height:1;
  }
  .name-en{
    font-family:'JetBrains Mono',monospace;font-weight:400;
    font-size:clamp(.62rem,3vw,.7rem);letter-spacing:.42em;text-transform:uppercase;
    color:var(--ink-45);margin-top:12px;
  }
  .role{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;
    font-size:1.02rem;letter-spacing:.03em;color:var(--ink-70);
  }

  .contacts{display:flex;flex-direction:column}
  .contact-item{
    display:flex;align-items:center;gap:14px;
    padding:11px 2px;border-bottom:1px solid var(--rule-soft);
    animation:rise .9s cubic-bezier(.22,1,.36,1) both;
  }
  .contact-item:last-child{border-bottom:none}
  .contact-item:nth-child(1){animation-delay:.10s}
  .contact-item:nth-child(2){animation-delay:.18s}
  .contact-item:nth-child(3){animation-delay:.26s}
  .contact-item:nth-child(4){animation-delay:.34s}

  .label{
    flex-shrink:0;width:46px;
    font-family:'JetBrains Mono',monospace;font-weight:400;
    font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-45);
  }
  .value{
    font-family:'JetBrains Mono',monospace;font-weight:400;
    font-size:clamp(.7rem,3.1vw,.78rem);letter-spacing:.01em;color:var(--ink);
    text-decoration:none;position:relative;
  }
  a.value::after{
    content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;
    background:var(--ink);transform:scaleX(0);transform-origin:left;
    transition:transform .35s cubic-bezier(.22,1,.36,1);
  }
  a.value:hover::after,a.value:focus-visible::after{transform:scaleX(1)}
  a.value:focus-visible{outline:1px solid var(--ink);outline-offset:4px}

  .footer{
    margin-top:22px;display:flex;align-items:center;justify-content:space-between;
    font-family:'JetBrains Mono',monospace;font-weight:300;
    font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-45);
  }

  .share-btn{
    background:transparent;border:1px solid var(--rule);
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .3s,border-color .3s;
  }
  .share-btn svg{width:12px;height:12px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
  .share-btn:hover{background:var(--ink);border-color:var(--ink)}
  .share-btn:hover svg{stroke:var(--paper)}
  .share-btn:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

  .toast{
    position:fixed;bottom:32px;left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:var(--paper);
    font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
    padding:10px 18px;white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity .3s,transform .3s;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
