<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>[차시현 · Tristan Cha]</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080808;
      --silver-1: #f0f0f0;
      --silver-2: #c8c8c8;
      --silver-3: #909090;
      --silver-4: #585858;
      --glow: rgba(200, 200, 210, 0.18);
      --line: rgba(180, 180, 200, 0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* Subtle noise texture overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient radial glow */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(160,160,180,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(92vw, 400px);
      padding: 44px 40px 40px;
      background: linear-gradient(145deg, #111111 0%, #0c0c0c 60%, #0a0a0a 100%);
      border: 1px solid var(--line);
      border-radius: 3px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 8px 60px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.05);
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Thin top accent line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200,200,220,0.5), transparent);
    }

    /* Corner marks */
    .card::after {
      content: '';
      position: absolute;
      top: 14px; right: 14px;
      width: 10px; height: 10px;
      border-top: 1px solid var(--silver-4);
      border-right: 1px solid var(--silver-4);
    }

    .corner-bl {
      position: absolute;
      bottom: 14px; left: 14px;
      width: 10px; height: 10px;
      border-bottom: 1px solid var(--silver-4);
      border-left: 1px solid var(--silver-4);
    }

    /* ── Header ── */
    .header { margin-bottom: 28px; }

    .name-ko {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(2rem, 10vw, 2.5rem);
      letter-spacing: 0.12em;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 0%, #d8d8e0 40%, #a0a0b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s ease-in-out infinite;
    }

    .name-en {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      font-size: clamp(0.65rem, 3vw, 0.75rem);
      letter-spacing: 0.35em;
      color: var(--silver-3);
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(180,180,200,0.25), rgba(180,180,200,0.08) 80%, transparent);
      margin: 20px 0;
    }

    /* ── Role badge ── */
    .role {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: clamp(0.6rem, 2.8vw, 0.68rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--silver-3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
    }

    .role::before {
      content: '';
      display: inline-block;
      width: 18px; height: 1px;
      background: var(--silver-4);
    }

    /* ── Contact list ── */
    .contacts { display: flex; flex-direction: column; gap: 14px; }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 14px;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .contact-item:nth-child(1) { animation-delay: 0.15s; }
    .contact-item:nth-child(2) { animation-delay: 0.25s; }
    .contact-item:nth-child(3) { animation-delay: 0.35s; }
    .contact-item:nth-child(4) { animation-delay: 0.45s; }

    .icon-wrap {
      flex-shrink: 0;
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: rgba(255,255,255,0.02);
    }

    .icon-wrap svg {
      width: 13px; height: 13px;
      stroke: var(--silver-3);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .contact-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: clamp(0.72rem, 3.2vw, 0.82rem);
      letter-spacing: 0.04em;
      color: var(--silver-2);
    }

    a.contact-text {
      text-decoration: none;
      color: var(--silver-2);
      transition: color 0.3s;
    }
    a.contact-text:hover { color: var(--silver-1); }

    /* ── Footer ── */
    .footer {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--silver-4);
    }
    .dot:first-child { background: var(--silver-3); }

    /* ── Share button ── */
    .share-btn {
      position: absolute;
      top: 16px; right: 36px;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s;
      z-index: 2;
    }

    .share-btn:hover {
      border-color: var(--silver-4);
      background: rgba(255,255,255,0.04);
    }

    .share-btn svg {
      width: 12px; height: 12px;
      stroke: var(--silver-3);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s;
    }

    .share-btn:hover svg { stroke: var(--silver-1); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(30,30,30,0.95);
      border: 1px solid var(--line);
      color: var(--silver-2);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      padding: 9px 18px;
      border-radius: 2px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
      0%, 100% { filter: brightness(1); }
      50%       { filter: brightness(1.15); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="corner-bl"></div>

    <!-- Share button -->
    <button class="share-btn" onclick="shareLink()" title="링크 공유">
      <svg viewBox="0 0 24 24">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </button>

    <div class="header">
      <div class="name-ko">차시현</div>
      <div class="name-en">Tristan Cha</div>
    </div>

    <div class="divider"></div>

    <div class="role">AI &amp; Cyber Security</div>

    <div class="contacts">

      <!-- Phone -->
      <div class="contact-item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8a19.79 19.79 0 01-3.07-8.68A2 2 0 012 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
          </svg>
        </div>
        <span class="contact-text">010-3717-5470</span>
      </div>

      <!-- Email -->
      <div class="contact-item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <a class="contact-text" href="mailto:example@gmail.com">csihyeon9@gmail.com</a>
      </div>

      <!-- GitHub -->
      <div class="contact-item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/>
          </svg>
        </div>
        <a class="contact-text" href="https://github.com/csihyeon05" target="_blank" rel="noopener">github.com/csihyeon05</a>
      </div>

      <!-- Website -->
      <div class="contact-item">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
          </svg>
        </div>
        <a class="contact-text" href="https://csihyeon.tistory.com" target="_blank" rel="noopener">csihyeon.tistory.com</a>
      </div>

    </div>

    <div class="footer">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <div class="toast" id="toast">Copied!</div>

  <script>
    async function shareLink() {
      const url = window.location.href;
      if (navigator.share) {
        try {
          await navigator.share({ title: '차시현 · Sihyun Cha', url });
          return;
        } catch (_) {}
      }
      try {
        await navigator.clipboard.writeText(url);
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
